<style>
  :root{
    --ink:#20241f;
    --paper:#f6f3ec;
    --line:#2b2b28;
    --accent:#b5502e;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  header{
    padding:18px 28px 12px 28px;
    flex:0 0 auto;
    border-bottom:1px solid rgba(43,43,40,0.12);
  }

  h1{
    margin:0;
    font-size:22px;
    font-weight:650;
    letter-spacing:-0.01em;
  }

  header p{
    margin:4px 0 0 0;
    font-size:13px;
    color:rgba(32,36,31,0.6);
  }

  .map-wrap{
    flex:1 1 auto;
    position:relative;
    min-height:0;
  }

  svg{
    display:block;
    width:100%;
    height:100%;
  }

  path.state{
    stroke:var(--line);
    stroke-width:0.7px;
    cursor:pointer;
    transition:filter 180ms ease;
  }

  path.state:hover,
  path.state.hovered{
    filter:brightness(1.08) drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }

  .tooltip{
    position:fixed;
    pointer-events:none;
    background:var(--card);
    border:1px solid rgba(43,43,40,0.18);
    border-radius:6px;
    padding:7px 11px;
    font-size:13px;
    line-height:1.3;
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
    opacity:0;
    transition:opacity 120ms ease;
    z-index:10;
    max-width:220px;
  }
  .tooltip.visible{ opacity:1; }
  .tooltip .name{
    font-weight:650;
    font-size:14px;
  }

  footer{
    flex:0 0 auto;
    padding:8px 28px 12px 28px;
    font-size:11.5px;
    color:rgba(32,36,31,0.55);
    border-top:1px solid rgba(43,43,40,0.10);
  }

  @media (max-width:640px){
    h1{ font-size:18px; }
    header p{ font-size:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Map of India</h1>
    <p>States &amp; union territories — hover a region to see it lift, hover to read its name</p>
  </header>
  <div class="map-wrap">
    <svg id="map"></svg>
    <div class="tooltip" id="tooltip"><div class="name" id="tooltip-name"></div></div>
  </div>
  <footer>Boundaries are simplified for rendering; for administrative or legal use, refer to Survey of India sources.</footer>
</div>

// ---------------------------------------------------------------------------
// 2. SETUP: SVG canvas, projection fitted to India's extent, path generator
// ---------------------------------------------------------------------------
const svg = d3.select('#map');
const tooltip = d3.select('#tooltip');
const tooltipName = d3.select('#tooltip-name');
const g = svg.append('g');

// A categorical, hand-picked palette (not the default d3 scheme) with enough
// distinct hues to keep neighbouring states visually separate.
const palette = [
  '#c1502e','#3d7a5f','#e0a63e','#4c6a92','#a35b8f',
  '#7a8f3f','#b3763b','#5a8a8a','#9b4d4d','#6b5b95',
  '#3f8f65','#cc8f2e','#4a6fa5','#8a5a44','#578a3f',
  '#a34c6e','#3a7a9a','#c1783e','#5f6f9f','#7a4f7a'
];
const color = d3.scaleOrdinal(palette);

const projection = d3.geoMercator();
const path = d3.geoPath().projection(projection);

let currentTransform = d3.zoomIdentity;

function render(){
  const wrap = document.querySelector('.map-wrap');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${width} ${height}`);

  projection.fitExtent([[20,20],[width-20,height-20]], INDIA_GEOJSON);

  const paths = g.selectAll('path.state')
    .data(INDIA_GEOJSON.features, d => d.properties.name);

  paths.enter()
    .append('path')
    .attr('class','state')
    .attr('fill', (d,i) => color(d.properties.name))
    .attr('d', path)
    // Store each state's own centroid (in pixel space) so the pop effect
    // can scale from the *shape's* center rather than the SVG's origin.
    .each(function(d){ d.__centroid = path.centroid(d); })
    .on('mouseenter', function(event, d){
      d3.select(this).classed('hovered', true).raise();
      tooltipName.text(d.properties.name);
      tooltip.classed('visible', true);
      positionTooltip(event);
    })
    .on('mousemove', function(event){
      positionTooltip(event);
    })
    .on('mouseleave', function(){
      d3.select(this).classed('hovered', false);
      tooltip.classed('visible', false);
    })
    .merge(paths)
    .attr('d', path)
    .each(function(d){ d.__centroid = path.centroid(d); });
}

// Position the tooltip near the cursor, keeping it inside the viewport.
function positionTooltip(event){
  const pad = 14;
  let x = event.clientX + pad;
  let y = event.clientY + pad;
  const tw = 220, th = 40;
  if (x + tw > window.innerWidth) x = event.clientX - tw - pad;
  if (y + th > window.innerHeight) y = event.clientY - th - pad;
  tooltip.style('left', x + 'px').style('top', y + 'px');
}

// ---------------------------------------------------------------------------
// 3. HOVER "POP" EFFECT
//    Each state pops out slightly on hover: scaled up a touch around its own
//    centroid (not the SVG origin), so it visually lifts in place rather
//    than sliding toward a corner. We use an SVG `transform` attribute of
//    `translate(cx,cy) scale(s) translate(-cx,-cy)` — anchoring the scale at
//    the shape's own centroid — which is supported everywhere, rather than
//    relying on the patchier CSS `transform-box: fill-box`.
// ---------------------------------------------------------------------------
function popTransform(cx, cy, scale){
  return `translate(${cx},${cy}) scale(${scale}) translate(${-cx},${-cy})`;
}

function attachPopEffect(){
  g.selectAll('path.state')
    .on('mouseenter.pop', function(event, d){
      const [cx, cy] = d.__centroid;
      d3.select(this)
        .transition().duration(160).ease(d3.easeCubicOut)
        .attr('transform', popTransform(cx, cy, 1.06));
    })
    .on('mouseleave.pop', function(event, d){
      const [cx, cy] = d.__centroid;
      d3.select(this)
        .transition().duration(180).ease(d3.easeCubicOut)
        .attr('transform', popTransform(cx, cy, 1));
    });
}

render();
attachPopEffect();

window.addEventListener('resize', () => {
  render();
  attachPopEffect();
});
